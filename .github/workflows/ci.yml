name: CI

on:
  push:
    branches: [main]
  pull_request:

# Padrão de menor privilégio: o topo nega tudo além de leitura; cada job que
# precisar de mais declara o seu próprio escopo explícito.
permissions:
  contents: read

# Um push novo no mesmo ramo cancela a execução anterior — não paga runner por
# resultado que já vai ser descartado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Actions fixadas por SHA de 40 hex (a própria Esteira reprova tag móvel);
      # o comentário registra a versão legível. Dependabot atualiza os SHAs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy src
      - name: Pytest
        run: pytest

  autoaudit:
    name: Autoauditoria (o Chaveiro se aponta para um token vulnerável)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e "."
      - name: Auditar um token alg:none e conferir que a ferramenta o pega
        # O `|| true` engole o código de saída 1 — que é a ferramenta FAZENDO o
        # trabalho (achado crítico => exit 1). O portão real é a asserção em
        # Python: o achado `alg-none` tem de estar no JSON, no schema da suíte.
        run: |
          TOKEN="eyJhbGciOiJub25lIn0.eyJzdWIiOiIxMjM0NTY3ODkwIn0."
          echo "$TOKEN" | chaveiro inspect - --format json --now 1700000000 > audit.json || true
          python - <<'PY'
          import json
          d = json.load(open("audit.json"))
          ids = [f["id"] for f in d["findings"]]
          assert "alg-none" in ids, f"esperava alg-none, veio {ids}"
          assert d["schema"] == "suite-appsec/1", d.get("schema")
          print("Autoauditoria OK — detectou:", ids)
          PY

  dependency-review:
    name: Revisão de dependências (PRs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: high
