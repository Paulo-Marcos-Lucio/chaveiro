name: Release

# Dispara por tag `vX.Y.Z` e por acionamento manual (para validar o pipeline
# sem esperar uma tag real — dry-run: builda e roda `twine check`, mas o job
# de publicação só roda em push de tag).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Padrão de menor privilégio: o topo nega tudo além de leitura; cada job que
# precisar de mais declara o seu próprio escopo explícito.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build · twine check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Actions fixadas por SHA de 40 hex (a própria Esteira reprova tag
      # móvel); o comentário registra a versão legível.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: Build sdist e wheel
        run: python -m build
      - name: Validar os artefatos antes de qualquer publicação
        run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publicar no PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Só publica em push de tag real. `workflow_dispatch` builda e valida
    # (job `build` acima) mas nunca chega aqui — é o modo dry-run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      # Environment protegido: exige revisor humano configurado em
      # Settings → Environments → pypi no GitHub (o workflow não cria a
      # regra de proteção sozinho — é decisão de negócio, não de robô).
      # O PyPI Trusted Publisher para este environment também precisa ser
      # cadastrado manualmente em pypi.org antes do primeiro uso real.
      name: pypi
      url: https://pypi.org/p/chaveiro
    permissions:
      # OIDC: nenhum token de PyPI vive em segredo do repositório.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
